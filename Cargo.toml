[package]
name = "doppler-kit"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "Speed and closest distance of a passing source from a Doppler or laser-ranging recording"

[dependencies]
eframe = "0.37"
egui_plot = "0.38"
rustfft = "6.4"
symphonia = { version = "0.5.5", features = ["all"] }
rfd = "0.17"
ureq = "3.4"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 2
